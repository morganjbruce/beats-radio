# fly.io config — deploy with: fly deploy
# One-time setup:
#   fly launch --no-deploy        # creates the app (keep this file when prompted)
#   fly volumes create beats_data --size 1 --region lhr
#   fly secrets set BEATS_TOKEN=<token>
app = "beats-radio"
primary_region = "lhr"

[build]

[env]
  PORT = "3001"

[mounts]
  source = "beats_data"
  destination = "/app/.beats"

[http_service]
  internal_port = 3001
  force_https = true
  # SSE radio: keep the machine up so listener streams and the queue survive idle periods.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
